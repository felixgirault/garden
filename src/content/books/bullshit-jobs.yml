title: Bullshit jobs
subtitle: A theory
author: David Graeber
lang: en
url: https://theanarchistlibrary.org/library/david-graeber-bullshit-jobs
quotes:
  - text: >
      So far, we have established three broad categories of jobs:
      useful jobs (which may or may not be shit jobs), bullshit
      jobs, and a small but ugly penumbra of jobs such as
      gangsters, slumlords, top corporate lawyers, or hedge fund
      CEOs, made up of people who are basically just selfish
      bastards and don’t really pretend to be anything else. In
      each case, I think it’s fair to trust that those who have
      these jobs know best which category they belong to.
  - text: >
      Obviously, there is no objective measure of quality whereby
      one can say that haircut X is worth $15, haircut Y, $150,
      and haircut Z, $1,500. In the latter case, most of the
      time, what the customer is paying for anyway is mainly just
      the ability to say she paid $1,500 for a haircut, or
      perhaps that he got his hair done by the same stylist as
      Kim Kardashian or Tom Cruise. We are speaking of overt
      displays of wastefulness and extravagance. Now, one could
      certainly make the argument that there’s a deep structural
      affinity between wasteful extravagance and bullshit, and
      theorists of economic psychology from Thorstein Veblen, to
      Sigmund Freud, to Georges Bataille have pointed out that at
      the very pinnacle of the wealth pyramid—think here of
      Donald Trump’s gilded elevators—there is a very thin line
      between extreme luxury and total crap.
  - text: >
      Groos himself was primarily interested in asking why humans
      play games, and why they become so passionate and excited
      over the outcome even when they know it makes no difference
      who wins or loses outside the confines of the game itself.
      He saw the creation of imaginary worlds as simply an
      extension of his core principle. This might be so. But what
      we’re concerned with here, unfortunately, is less with the
      implications for healthy development and more with what
      happens when something goes terribly wrong. In fact,
      experiments have also shown that if one first allows a
      child to discover and experience the delight in being able
      to cause a certain effect, and then suddenly denies it to
      them, the results are dramatic: first rage, refusal to
      engage, and then a kind of catatonic folding in on oneself
      and withdrawing from the world entirely. Psychiatrist and
      psychoanalyst Francis Broucek called this the “trauma of
      failed influence” and suspected that such traumatic
      experiences might lie behind many mental health issues
      later in life. If this is so, then it begins to give us a
      sense of why being trapped in a job where one is treated as
      if one were usefully employed, and has to play along with
      the pretense that one is usefully employed, but at the same
      time, is keenly aware one is not usefully employed, would
      have devastating effects. It’s not just an assault on the
      person’s sense of self-importance but also a direct attack
      on the very foundations of the sense that one even is a
      self. A human being unable to have a meaningful impact on
      the world ceases to exist.
  - text: >
      Very few economists have actually attempted to measure the
      overall social value of different professions; most would
      probably take the very idea as something of a fool’s
      errand; but those who have tried tend to confirm that there
      is indeed an inverse relation between usefulness and pay.
      In a 2017 paper, US economists Benjamin B. Lockwood,
      Charles G. Nathanson, and E. Glen Weyl combed through the
      existing literature on the “externalities” (social costs)
      and “spillover effects” (social benefits) associated with a
      variety of highly paid professions, to see if it were
      possible to calculate how much each adds to or subtracts
      from the economy overall. They concluded that while in some
      cases—notably anything associated with creative
      industries—the values involved were just too subjective to
      measure, in other cases, a rough approximation was
      possible. Their conclusion: the most socially valuable
      workers whose contributions could be calculated are medical
      researchers, who add $9 of overall value to society for
      every $1 they are paid. The least valuable were those who
      worked in the financial sector, who, on average, subtract a
      net $1.80 in value from society for every $1 of
      compensation. (And, of course, workers in the financial
      sector are often compensated extremely well.)
    page: 210
  - text: >
      Shullenberger speaks of an emerging “voluntariat,” with
      capitalist firms increasingly harvesting the results not of
      paid labor but of unpaid interns, internet enthusiasts,
      activists, volunteers, and hobbyists, and “digitally
      sharecropping” the results of popular enthusiasm and
      creativity to privatize and market the results. The free
      software industry, perversely enough, has become a paradigm
      in this respect. The reader may recall Pablo, who
      introduced the notion of duct taping in chapter 2: software
      engineering work was divided between the interesting and
      challenging work of developing core technologies, and the
      tedious labor of “applying duct tape” to allow different
      core technologies to work together, because the designers
      had never bothered to think about their compatibility. His
      main point, though, was that, increasingly, open source
      means that all the really engaging tasks are done for free:

      > Pablo: Where two decades ago, companies dismissed open
      source software and developed core technologies in-house,
      nowadays companies rely heavily on open source and employ
      software developers almost entirely to apply duct tape on
      core technologies they get for free. In the end, you can
      see people doing the nongratifying duct-taping work during
      office hours and then doing gratifying work on core
      technologies during the night. This leads to an interesting
      vicious circle: given that people choose to work on core
      technologies for free, no company is investing in those
      technologies. The underinvestment means that the core
      technologies are often unfinished, lacking quality, have a
      lot of rough edges, bugs, etc. That, in turn, creates need
      for duct tape and thus proliferation of duct-taping jobs.

      Paradoxically, the more that software engineers collaborate
      online to do free creative labor simply for the love of
      doing it, as a gift to humanity, the less incentive they
      have to make them compatible with other such software, and
      the more those same engineers will have to be employed in
      their day jobs fixing the damage—doing the sort of
      maintenance work that no one would be willing to do for
      free.
  - text: >
      Why, starting in the sixteenth century, did the middle
      classes suddenly develop such an interest in reforming the
      moral comportment of the poor—a subject they had not
      previously found of much interest one way or the other?
      This has always been something of a historical mystery. In
      the context of life-cycle service, though, it actually
      makes perfect sense. The poor were seen as frustrated
      adolescents. Work—and specifically, paid labor under the
      eye of a master—had traditionally been the means by which
      such adolescents learned how to be proper, disciplined,
      self-contained adults. While in practical terms Puritans
      and other pious reformers could no longer promise much to
      the poor—certainly not adulthood as it used to be
      conceived, as freedom from the need to work under the
      orders of others—they substituted charity, discipline, and
      a renewed infusion of theology. Work, they taught, was both
      punishment and redemption. Work was self-mortification and
      as such had value in itself, even beyond the wealth it
      produced, which was merely a sign of God’s favor (and not
      to be enjoyed too much.)
  - text: >
      It strikes me that recognizing that a great deal of work is
      not strictly speaking productive but caring, and that there
      is always a caring aspect even to the most apparently
      impersonal work, does suggest one reason why it’s so
      difficult to simply create a different society with a
      different set of rules. Even if we don’t like what the
      world looks like, the fact remains that the conscious aim
      of most of our actions, productive or otherwise, is to do
      well by others; often, very specific others. Our actions
      are caught up in relations of caring. But most caring
      relations require we leave the world more or less as we
      found it. In the same way that teenage idealists regularly
      abandon their dreams of creating a better world and come to
      accept the compromises of adult life at precisely the
      moment they marry and have children, caring for others,
      especially over the long term, requires maintaining a world
      that’s relatively predictable as the grounds on which
      caring can take place. One cannot save to ensure a college
      education for one’s children unless one is sure in twenty
      years there will still be colleges—or for that matter,
      money. And that, in turn, means that love for
      others—people, animals, landscapes—regularly requires the
      maintenance of institutional structures one might otherwise
      despise.
  - text: >
      Leslie told me of studies that demonstrate that any system
      of means testing, no matter how it’s framed, will
      necessarily mean at least 20 percent of those who
      legitimately qualify for benefits give up and don’t apply.
      That’s almost certainly more than the number of “cheats”
      who might be detected by the rules—in fact, even counting
      those who are honestly mistaken the number still only comes
      to 1.6 percent. The 20 percent figure would apply even if
      no one actually was formally denied benefits at all. But of
      course the rules are designed to deny as many claimants as
      can plausibly be denied: between sanctions and capricious
      applications of the rules, we’ve gotten to the point now
      where 60 percent of those eligible for unemployment
      benefits in the United Kingdom don’t get them. In other
      words, everyone she describes, the entire archipelago that
      starts with the bureaucrats who write the rules, and
      includes the DWP, enforcement tribunals, advocates, and
      employees who work for the funding bodies that process
      applications for the NGOs that employ those advocates, all
      of them, are part of a single vast apparatus that exists to
      maintain the illusion that people are naturally lazy and
      don’t really want to work—and therefore, that even if
      society does have a responsibility to ensure they don’t
      literally starve to death, it is necessary to make the
      process of providing them with the means of continued
      existence as confusing, time-consuming, and humiliating as
      possible.
    page: 273
