title: The Utopia of Rules
subtitle:
  On Technology, Stupidity, and the Secret Joys of Bureaucracy
author: David Graeber
lang: en
url: https://theanarchistlibrary.org/library/david-graeber-the-utopia-of-rules
quotes:
  - text: >
      Now, I admit that this emphasis on violence might seem odd.
      We are not used to thinking of nursing homes or banks or
      even HMOs as violent institutions—except perhaps in the
      most abstract and metaphorical sense. But the violence I’m
      referring to here is not abstract. I am not speaking of
      conceptual violence. I am speaking of violence in the
      literal sense: the kind that involves, say, one person
      hitting another over the head with a wooden stick. All of
      these are institutions involved in the allocation of
      resources within a system of property rights regulated and
      guaranteed by governments in a system that ultimately rests
      on the threat of force. “Force” in turn is just a
      euphemistic way to refer to violence: that is, the ability
      to call up people dressed in uniforms, willing to threaten
      to hit others over the head with wooden sticks.
