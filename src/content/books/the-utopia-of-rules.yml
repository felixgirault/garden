title: The Utopia of Rules
subtitle:
  On Technology, Stupidity, and the Secret Joys of Bureaucracy
author: David Graeber
lang: en
url: https://theanarchistlibrary.org/library/david-graeber-the-utopia-of-rules
quotes:
  - text: >
      For all its celebration of markets and individual
      initiative, this alliance of government and finance often
      produces results that bear a striking resemblance to the
      worst excesses of bureaucratization in the former Soviet
      Union or former colonial backwaters of the Global South.
      There is a rich anthropological literature, for instance,
      on the cult of certificates, licenses, and diplomas in the
      former colonial world. Often the argument is that in
      countries like Bangladesh, Trinidad, or Cameroon, which
      hover between the stifling legacy of colonial domination
      and their own magical traditions, official credentials are
      seen as a kind of material fetish—magical objects conveying
      power in their own right, entirely apart from the real
      knowledge, experience, or training they’re supposed to
      represent. But since the eighties, the real explosion of
      credentialism has been in what are supposedly the most
      “advanced” economies, like the United States, Great
      Britain, or Canada. As one anthropologist, Sarah Kendzior,
      puts it:

      “The United States has become the most rigidly
      credentialised society in the world,” write James Engell
      and Anthony Dangerfield in their 2005 book Saving Higher
      Education in the Age of Money. “A BA is required for jobs
      that by no stretch of imagination need two years of
      full-time training, let alone four.”

      The promotion of college as a requirement for a
      middle-class life … has resulted in the exclusion of the
      non-college educated from professions of public influence.
      In 1971, 58 percent of journalists had a college degree.
      Today, 92 percent do, and at many publications, a graduate
      degree in journalism is required—despite the fact that most
      renowned journalists have never studied journalism.

      Journalism is one of many fields of public
      influence—including politics—in which credentials function
      as de facto permission to speak, rendering those who lack
      them less likely to be employed and less able to afford to
      stay in their field. Ability is discounted without
      credentials, but the ability to purchase credentials rests,
      more often than not, on family wealth.

      One could repeat the story in field after field, from
      nurses to art teachers, physical therapists to foreign
      policy consultants. Almost every endeavor that used to be
      considered an art (best learned through doing) now requires
      formal professional training and a certificate of
      completion, and this seems to be happening, equally, in
      both the private and public sectors, since, as already
      noted, in matters bureaucratic, such distinctions are
      becoming effectively meaningless. While these measures are
      touted—as are all bureaucratic measures—as a way of
      creating fair, impersonal mechanisms in fields previously
      dominated by insider knowledge and social connections, the
      effect is often the opposite. As anyone who has been to
      graduate school knows, it’s precisely the children of the
      professional- managerial classes, those whose family
      resources make them the least in need of financial support,
      who best know how to navigate the world of paperwork that
      enables them to get said support. For everyone else, the
      main result of one’s years of professional training is to
      ensure that one is saddled with such an enormous burden of
      student debt that a substantial chunk of any subsequent
      income one will get from pursuing that profession will
      henceforth be siphoned off, each month, by the financial
      sector. In some cases, these new training requirements can
      only be described as outright scams, as when lenders, and
      those prepared to set up the training programs, jointly
      lobby the government to insist that, say, all pharmacists
      be henceforth required to pass some additional qualifying
      examination, forcing thousands already practicing the
      profession into night school, which these pharmacists know
      many will only be able to afford with the help of
      high-interest student loans. By doing this, lenders are in
      effect legislating themselves a cut of most pharmacists’
      subsequent incomes.
    page: 22–23
  - text: >
      The armies of highly militarized police that appeared to
      attack the summit protestors were not some sort of weird
      side effect of “globalization.” Whenever someone starts
      talking about the “free market,” it’s a good idea to look
      around for the man with the gun. He’s never far away.
      Free-market liberalism of the nineteenth century
      corresponded with the invention of the modern police and
      private detective agencies, and gradually, with the notion
      that those police had at least ultimate jurisdiction over
      virtually every aspect of urban life, from the regulation
      of street peddlers to noise levels at private parties, or
      even to the resolution of bitter fights with crazy uncles
      or college roommates. We are now so used to the idea that
      we at least could call the police to resolve virtually any
      difficult circumstance that many of us find it difficult to
      even imagine what people would have done before this was
      possible. Because, in fact, for the vast majority of people
      throughout history—even those who lived in in large
      cities—there were simply no authorities to call in such
      circumstances. Or, at least, no impersonal bureaucratic
      ones who were, like the modern police, empowered to impose
      arbitrary resolutions backed by the threat of force.
    page: 31–32
  - text: >
      Much of what bureaucrats do, after all, is evaluate things.
      They are continually assessing, auditing, measuring,
      weighing the relative merits of different plans, proposals,
      applications, courses of action, or candidates for
      promotion. Market reforms only reinforce this tendency.
      This happens on every level. It is felt most cruelly by the
      poor, who are constantly monitored by an intrusive army of
      moralistic box-tickers assessing their child-rearing
      skills, inspecting their food cabinets to see if they are
      really cohabiting with their partners, determining whether
      they have been trying hard enough to find a job, or whether
      their medical conditions are really sufficiently severe to
      disqualify them from physical labor. All rich countries now
      employ legions of functionaries whose primary function is
      to make poor people feel bad about themselves. But the
      culture of evaluation is if anything even more pervasive in
      the hypercredentialized world of the professional classes,
      where audit culture reigns, and nothing is real that cannot
      be quantified, tabulated, or entered into some interface or
      quarterly report. Not only is this world ultimately a
      product of financialization, it’s really just a
      continuation of it. Since what is the world of securitized
      derivatives, collateralized debt obligations, and other
      such exotic financial instruments but the apotheosis of the
      principle that value is ultimately a product of paperwork,
      and the very apex of a mountain of assessment forms which
      begins with the irritating caseworker determining whether
      you are really poor enough to merit a fee waiver for your
      children’s medicine and ends with men in suits engaged in
      high-speed trading of bets over how long it will take you
      to default on your mortgage.
    page: 41–42
  - text: >
      Now, I admit that this emphasis on violence might seem odd.
      We are not used to thinking of nursing homes or banks or
      even HMOs as violent institutions—except perhaps in the
      most abstract and metaphorical sense. But the violence I’m
      referring to here is not abstract. I am not speaking of
      conceptual violence. I am speaking of violence in the
      literal sense: the kind that involves, say, one person
      hitting another over the head with a wooden stick. All of
      these are institutions involved in the allocation of
      resources within a system of property rights regulated and
      guaranteed by governments in a system that ultimately rests
      on the threat of force. “Force” in turn is just a
      euphemistic way to refer to violence: that is, the ability
      to call up people dressed in uniforms, willing to threaten
      to hit others over the head with wooden sticks.
    page: 58–59
  - text: >
      It is true that the effects one can have by disabling or
      killing someone are very limited. But they are real
      enough—and critically, it is possible to know in advance
      exactly what they are going to be. Any alternative form of
      action cannot, without some sort of appeal to shared
      meanings or understandings, have any predictable effects at
      all. What’s more, while attempts to influence others by the
      threat of violence do require some level of shared
      understandings, these can be pretty minimal. Most human
      relations—particularly ongoing ones, whether between
      longstanding friends or longstanding enemies—are extremely
      complicated, dense with history and meaning. Maintaining
      them requires a constant and often subtle work of
      imagination, of endlessly trying to see the world from
      others’ points of view. This is what I’ve already referred
      to as “interpretive labor.” Threatening others with
      physical harm allows the possibility of cutting through all
      this. It makes possible relations of a far more simple and
      schematic kind (“cross this line and I will shoot you,”
      “one more word out of any of you and you’re going to
      jail”). This is of course why violence is so often the
      preferred weapon of the stupid. One might even call it the
      trump card of the stupid, since (and this is surely one of
      the tragedies of human existence) it is the one form of
      stupidity to which it is most difficult to come up with an
      intelligent response.

      I do need to introduce one crucial qualification here.
      Everything, here, depends on the balance of forces. If two
      parties are engaged in a relatively equal contest of
      violence—say, generals commanding opposing armies—they have
      good reason to try to get inside each other’s heads. It is
      only when one side has an overwhelming advantage in their
      capacity to cause physical harm that they no longer need to
      do so. But this has very profound effects, because it means
      that the most characteristic effect of violence, its
      ability to obviate the need for “interpretive labor,”
      becomes most salient when the violence itself is least
      visible— in fact, where acts of spectacular physical
      violence are least likely to occur. These are of course
      precisely what I have just defined as situations of
      structural violence, systematic inequalities ultimately
      backed up by the threat of force. For this reason,
      situations of structural violence invariably produce
      extreme lopsided structures of imaginative identification.

      These effects are often most visible when the structures of
      inequality take the most deeply internalized forms. Gender
      is again a classic case in point. For example, in American
      situation comedies of the 1950s, there was a constant
      staple: jokes about the impossibility of understanding
      women. The jokes (told, of course, by men) always
      represented women’s logic as fundamentally alien and
      incomprehensible. “You have to love them,” the message
      always seemed to run, “but who can really understand how
      these creatures think?” One never had the impression the
      women in question had any trouble understanding men. The
      reason is obvious. Women had no choice but to understand
      men. In America, the fifties were the heyday of a certain
      ideal of the one-income patriarchal family, and among the
      more affluent, the ideal was often achieved. Women with no
      access to their own income or resources obviously had no
      choice but to spend a great deal of time and energy
      understanding what their menfolk thought was going on.
