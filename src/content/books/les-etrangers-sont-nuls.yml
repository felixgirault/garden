title: Les étrangers sont nuls
author: Pierre Desproges
lang: fr
quotes:
  - text: >
      Les Grecs sont appelés ainsi parce qu’ils sont tous pédés.
      Ne dit-on point : «Va te faire enculer chez les Grecs» ?
      Alors qu’on dit  beaucoup plus rarement : «Va te faire
      enculer chez les Bellifontains» («Bellifontains» signifie
      «Fontaineblois» en grec. Je le précise  à l’intention des
      éventuels lecteurs incultes ou ouvriers). Les Grecs
      s’appellent aussi «Hélène» : c’est dire à quel point ils
      sont pédés. Quelquefois, ils enculent même leurs chevaux et
      roulent des pelles aux poneyses. Cette pratique fort
      répandue n’est autre que l’hipposexualité, du grec hippo,
      le cheval, et sexualité, crac-crac.
