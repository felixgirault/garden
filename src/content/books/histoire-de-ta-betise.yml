title: Histoire de ta bêtise
author: François Bégaudeau
lang: fr
url: https://fr.scribd.com/document/844450922/Histoire-de-Ta-Betise-Francois-Begaudeau-Z-Library
quotes:
  - text: >
      Confrontée à la baisse tendancielle du taux de profit au
      sein d’un marché saturé, le capital doit créer de la
      demande. L’extension coloniale n’y suffisant pas, il
      stimule la demande intérieure des pauvres, qui ont cette
      qualité lucrative d’être nombreux. Il s’efforce alors de
      créer, non pas exactement de nouveaux besoins, mais de
      nouvelles pulsions d’achat. Au strict besoin, il ajoute le
      désir. La marchandise sera moins utile que désirable. Il en
      suscitera le désir en la décrétant désirable – mimétisme,
      circularité, mode. Dès lors la marchandise se fait
      chatoyante, engageante comme un sourire. Elle se départ de
      la raideur sèche du produit de nécessité. Elle ondule sur
      place pour attirer ton attention. Elle fait des clins d’œil
      coquins. Elle fait un peu sa pute.

      Le siècle avançant, le principe de plaisir est élargi aux
      producteurs. À l’unisson du consommateur censé jouir de
      consommer, le travailleur est convié à jouir de travailler.
      On s’assurait qu’il fasse le boulot, on veut désormais
      qu’il soit motivé à le faire. Qu’il s’épanouisse dans le
      travail, s’émancipe par la start-up. Qu’il soit corporate.
      Qu’il se soude dans des séminaires. Qu’une cohésion règne à
      tous les étages, entre tous les postes, tous les grades.
      Qu’on soit une team, et un team ce serait encore mieux.

      Le management sera cool, sera lean. Zuckerberg donnera ses
      conférences en claquettes. Chaque lundi tu réuniras tes
      collaborateurs pour un briefing autour de fruits – pas de
      viennoiseries. Chacun sera amicalement convié à s’exprimer
      sans tabou. En cas de désaccord sur les orientations, on
      cherchera un compromis. On cherchera, entre le dur et le
      doux, entre le ferme et le mou, entre leadership et
      horizontalité, un juste milieu.

      La superstructure idéologique de ta condition commerçante
      est le centrisme.
    page: 172–173
  - text: >
      Ce que tu appelles nuance n’est que du dosage, et la pensée
      n’est pas produite par dosages. La pensée n’est pas un père
      de famille ou de la nation en quête de compromis
      conservatoires. Elle n’avance pas par la négative comme la
      tienne, tout entière façonnée en réplique à ce qui te
      conteste. Affirmative par nature, la pensée dit cela, donc
      ne dit pas ceci. Elle tranche, découpe, taille, divise.
      Elle dérègle l’existant, le décentre, le force, le
      contraint. Lui fait violence. Il y a une violence de la
      pensée, et tu refuses la violence – refuses de la voir. Une
      pensée, si c’en est une, on la sent passer ; comme on sent
      un poing sur le crâne, ou un coup de hache dans une mer
      gelée, dit aussi Kafka.

      Il n’y a de pensée que radicale.

      Ce qu’insolemment je nomme bêtise est une production
      historique, le précipité chimique de ta position dominante
      et donc responsable, et donc raisonnable. Raisonnable, tu
      n’empoignes jamais le manche de la hache qui pense.

      Ni celui du marteau.
    page: 191
