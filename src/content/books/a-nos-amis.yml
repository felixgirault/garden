title: À nos amis
author: Comité invisible
url: https://fr.scribd.com/document/272095366/comite-invisible-A-nos-amis-integral
lang: fr
quotes:
  - text: >
      La gauche de la gauche quand on lui demande en quoi
      consisterait la révolution, s'empresse de répondre « mettre
      l'humain au centre ». Ce qu'elle ne réalise pas cette
      gauche-là, c'est combien le monde est fatigué de l'humain,
      combien nous sommes fatigués de l'humanité – cette espèce
      qui s'est crue le joyau de la création, qui s'est estimée
      en droit de tout saccager puisque tout lui revenait. «
      Mettre l'humain au centre » c'était le projet occidental,
      il a mené où l'on sait. Le moment est venu de quitter le
      navire, de trahir l’espèce. Il n'y a pas de grande famille
      humaine qui existerait séparément de chacun des mondes, de
      chacun des univers familiers, de chacune des formes de vies
      qui parsèment la terre.
    page: 31
  - text: >
      On ne peut sous-estimer la frénésie d’apocalypse, la soif
      d’Armageddon dont l’époque est traversée. Sa pornographie
      existentielle à elle, c’est de mater des documentaires
      d’anticipation montrant en images de synthèse les nuages de
      criquets qui viendront s’abattre en 2075 sur les vignobles
      de Bordeaux et les hordes de « migrants climatiques » qui
      prendront d’assaut les rives sud de l’Europe – ceux que
      Frontex se fait d’ores et déjà un devoir de décimer. Rien
      n’est plus vieux que la fin du monde. La passion
      apocalyptique n’a cessé d’avoir, depuis la plus haute
      antiquité, la faveur des impuissants. La nouveauté, c’est
      que nous vivons une époque où l’apocalyptique a été
      intégralement absorbée par le capital, et mise à son
      service. L’horizon de la catastrophe est ce à partir de
      quoi nous sommes présentement gouvernés. Or s’il y a bien
      une chose vouée à rester inaccomplie, c’est la prophétie
      apocalyptique, qu’elle soit économique, climatique,
      terroriste ou nucléaire. Elle n’est énoncée que pour
      appeler les moyens de la conjurer, c’est-à-dire, le plus
      souvent, la nécessité du gouvernement. Aucune organisation,
      ni politique ni religieuse, ne s’est jamais avouée vaincue
      parce que les faits démentaient ses prophéties. Car le but
      de la prophétie n’est jamais d’avoir raison sur le futur,
      mais d’ opérer sur le présent: imposer ici et maintenant
      l’attente, la passivité, la soumission.
    page: 33
  - text: >
      Ce ne sont ni les bas-fonds, ni la classe ouvrière, ni la
      petite-bourgeoisie, ni les multitudes qui se révoltent.
      Rien qui ait assez d’homogénéité pour admettre un
      représentant. Il n’y a pas de nouveau sujet révolutionnaire
      dont l’émergence aurait échappé, jusque-là, aux
      observateurs. Si l’on dit alors que « le peuple » est dans
      la rue, ce n’est pas un peuple qui aurait existé
      préalablement, c’est au contraire celui qui préalablement
      manquait. Ce n’est pas « le peuple » qui produit le
      soulèvement, c’est le soulèvement qui produit son peuple,
      en suscitant l’expérience et l’intelligence communes, le
      tissu humain et le langage de la vie réelle qui avaient
      disparu. Les révolutions du passé promettaient une vie
      nouvelle, les insurrections contemporaines en livrent les
      clefs. Les virages d’ultras du Caire n’étaient pas des
      groupes révolutionnaires avant la « révolution », c’étaient
      seulement des bandes capables de s’organiser pour
      s’affronter avec la police ; c’est d’avoir tenu un rôle
      aussi éminent lors de la « révolution » qu’ils se sont
      trouvés forcés de se poser, en situation, les questions
      habituellement dévolues aux « révolutionnaires ».

      Là réside l’ événement : non dans le phénomène médiatique
      que l’on a forgé pour vampiriser la révolte par sa
      célébration extérieure, mais dans les rencontres qui s’y
      sont effectivement produites.
    page: 41
  - text: >
      *Le pouvoir, désormais, est l’ordre des choses même, et la
      police chargée de le défendre.* Il n’est pas simple de
      penser un pouvoir qui consiste dans des infrastructures,
      dans les moyens de les faire fonctionner, de les contrôler
      et de les bâtir. Comment contester un ordre qui ne se
      formule pas, qui se construit pas à pas et sans phrase. Un
      ordre qui s’est incorporé aux objets mêmes de la vie
      quotidienne. Un ordre dont la constitution politique est sa
      constitution matérielle. Un ordre qui se donne moins dans
      les paroles du président que dans le silence du
      fonctionnement optimal. Du temps où le pouvoir se
      manifestait par édits, lois et règlements, il laissait
      prise à la critique. Mais on ne critique pas un mur, on le
      détruit ou on le tague. Un gouvernement qui dispose la vie
      par ses instruments et ses aménagements, dont les énoncés
      prennent la forme d’une rue bordée de plots et surplombée
      de caméras, n’appelle, le plus souvent, qu’une destruction
      elle-même sans phrases. S’attaquer au cadre de la vie
      quotidienne est de ce fait devenu sacrilège : c’est quelque
      chose comme violer sa constitution. Le recours indiscriminé
      à la casse dans les émeutes urbaines dit à la fois la
      conscience de cet état de choses, et une relative
      impuissance face à lui. L’ordre mutique et inquestionnable
      que matérialise l’existence d’un abribusne gît
      malheureusement pas en morceaux unefois celui-ci fracassé.
      La théorie de la vitre brisée est encore debout quand on a
      brisé toutes les vitrines. Toutes les proclamations
      hypocrites sur le caractère sacré de l’« environnement »,
      toute la sainte croisade pour sa défense, ne s’éclairent
      qu’à la lueur de cette nouveauté : le pouvoir est lui-même
      devenu environnemental, il s’est fondu dans le décor. C’est
      lui que l’on appelle à défendre dans tous les appels
      officiels à « préserver l’environnement », et non les
      petits poissons.
    page: 86–87
  - text: >
      Derrière la promesse futuriste d’un monde d’hommes et
      d’objets intégralement connectés — quand voitures, frigos,
      montres, aspirateurs et godemichés seront directement
      reliés entre eux et à l’Internet —, il y a ce qui est déjà
      là : le fait que le plus polyvalent des capteurs soit déjà
      en fonctionnement — moi-même. « Je » partage ma
      géolocalisation, mon humeur, mes avis, mon récit de ce que
      j’ai vu aujourd’hui d’incroyable ou d’incroyablement banal.
      J’ai couru ; j’ai immédiatement partagé mon parcours, mon
      temps, mes performances et leur autoévaluation. Je poste en
      permanence des photos de mes vacances, de mes soirées, de
      mes émeutes, de mes collègues, de ce que je vais manger
      comme de ce que je vais baiser. J’ai l’air de ne rien faire
      et pourtant je produis, en permanence, de la donnée. Que je
      travaille ou pas, ma vie quotidienne, comme stock
      d’informations, reste intégralement valorisable. J’améliore
      en continu l’algorithme.

      « Grâce aux réseaux diffus de capteurs, nous aurons sur
      nous-mêmes le point de vue omniscient de Dieu. Pour la
      première fois, nous pouvons cartographier précisément la
      conduite de masses de gens jusque dans leur vie quotidienne
      », s’enthousiasme tel professeur du MIT.
    page: 114
  - text: >
      La techno-logie est un discours sur les techniques qui ne
      cesse de se réaliser. De même que l’idéologie de la fête
      est la mort de la fête réelle, que l’idéologie de la
      rencontre est l’impossibilité même de la rencontre, la
      technologie est la neutralisation de toutes les techniques
      particulières. Le capitalisme est en ce sens
      essentiellement technologique ; il est l’organisation
      rentable, en un système,  des techniques les plus
      productives. Sa figure cardinale n’est pas l’économiste,
      mais l’ingénieur. L’ingénieur est le spécialiste et donc
      l’expropriateur en chef des techniques, celui qui ne se
      laisse affecter par aucune d’entre elles, et propage
      partout sa propre absence de monde. C’est une figure triste
      et serve. La solidarité entre capitalisme et socialisme se
      noue là : dans le culte de l’ingénieur. Ce sont des
      ingénieurs qui ont élaboré la plupart des modèles de
      l’économie néoclassique comme des logiciels de trading
      contemporains. Rappelons-nous que le titre de gloire de
      Brejnev fut d’avoir été ingénieur dans l’industrie
      métallurgique en Ukraine.

      La figure du hacker s’oppose point par point à la figure de
      l’ingénieur, quelles que soient les tentatives artistiques,
      policières ou entrepreneuriales de la neutraliser.
    page: 126
  - text: >
      En 1986, « Doctor Crash » écrivait : « Que tu le saches ou
      non, si tu es un hacker, tu es un révolutionnaire. Ne
      t’inquiète pas, tu es du bon côté. » Il n’est pas sûr
      qu’une telle innocence soit encore permise. Il y a dans le
      milieu hacker une illusion originaire selon laquelle on
      pourrait opposer la « liberté del’information », la «
      liberté de l’Internet » ou la « liberté de l’individu » à
      ceux qui entendent les contrôler. C’est là une grave
      méprise. La liberté et la surveillance relèvent du même
      paradigme de gouvernement. L’extension infinie des
      procédures de contrôle est historiquement le corollaire
      d’une forme de pouvoir qui se réalise au travers de la
      liberté des individus. Le gouvernement libéral n’est pas
      celui qui s’exerce directement sur le corps de ses sujets
      ou attend d’eux une obéissance filiale. C’est un pouvoir
      tout en retrait, qui préfère agencer l’espace et régner sur
      des intérêts, plutôt que sur des corps. Un pouvoir qui
      veille, surveille et agit minimalement, n’intervenant que
      là où le cadre est menacé, sur ce qui va trop loin. On ne
      gouverne que des sujets libres, et pris en masse. La
      liberté individuelle n’est pas quelque chose que l’on
      puisse brandir contre le gouvernement, car elle est
      justement le mécanisme sur lequel il s’appuie, celui qu’il
      règle le plus finement possible afin d’obtenir, de
      l’agrégation de toutes ces libertés, l’effet de masse
      escompté.
    page: 128
