title: L'insurrection qui vient
author: Comité invisible
url: https://fr.scribd.com/doc/9205848/L-insurrection-qui-vient
lang: fr
quotes:
  - text: >
      Se rassembler répond à la joie d’éprouver une puissance
      commune. Décider n’est vital que dans les situations
      d’urgence, où l’exercice de la démocratie est de toute
      façon compromis. Pour le reste du temps, le problème n’est
      celui du «caractère démocratique du processus de prise de
      décision» que pour les fanatiques de la procédure. Il n’y a
      pas àcritiquer les assemblées ou à les déserter, mais à y
      libérer la parole, les gestes et les jeux entre les êtres.
      Il suffit de voir que chacun n’y vient pas seulement avec
      un point de vue, une motion, mais avec des désirs, des
      attachements, des capacités, des forces, des tristesses et
      une certaine disponibilité. Si l’on parvient ainsi à
      déchirer ce fantasme de l’Assemblée Générale au profit
      d’une telle *assemblée des présences*, si l’on parvient à
      déjouer la toujours renaissante tentation de l’hégémonie,
      si l’on cesse de se fixer la décision comme finalité, il y
      a quelques chances que se produise une de ces prises en
      masse, l’un de ces phénomènes de cristallisation collective
      où une décision prend les êtres, dans leur totalité ou
      seulement pour partie.
    page: 113
